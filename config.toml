# Single source of truth for the robot setup.
# robot.py builds every lerobot command from this file, so recording and
# rollout always use the same ports, ids and camera keys/resolution/fps.
# (A mismatch between record and rollout is the #1 reason a policy "does nothing".)

[hf]
user = "CHANGE_ME"                    # your Hugging Face username (hf auth whoami)
dataset = "pick_pen"                  # -> <user>/<dataset> on the Hub (team task, matches [skills.pick_pen])
policy = "act_pick_pen"               # -> <user>/<policy> on the Hub

[task]
# Natural-language task string stored in the dataset (also used by SmolVLA if you switch later).
description = "Pick up the pen"
episode_time_s = 15                   # reach, grasp, lift ~10 cm, hold (disturbance demos: move a bit faster)
reset_time_s = 10                     # time to put the pen back between episodes
fps = 30

[follower]
type = "so101_follower"
port = "COM3"                         # find with: python robot.py find-port
id = "follower"                       # calibration file name - never change after calibrating

[leader]
type = "so101_leader"
port = "COM4"
id = "leader"

# One table per camera. The table name becomes the camera key in the dataset
# (observation.images.<name>). Find indexes with: python robot.py find-cameras
# Windows can reorder webcam indexes after a replug - re-check before recording.
[cameras.front]
index = 0
width = 640
height = 480
fps = 30

# Uncomment for a second (e.g. wrist) camera. Two views help ACT a lot with grasping.
# [cameras.wrist]
# index = 1
# width = 640
# height = 480
# fps = 30

[train]
# Measured on the GTX 1650 (4 GB), ACT, 640x480 cameras - see README "GPU benchmark".
# Keep GPU memory under ~3.3 GB: above that Windows spills into system RAM and a step gets ~10x slower.
steps = 20000                         # 20k x batch 8 = 160k samples, ~5 passes over 50 x 20 s episodes
batch_size = 8                        # 1 camera: 8 fits (~2.0 GB, ~0.48 s/step), 16 spills. 2 cameras: use 4.
use_amp = false                       # fp16 is ~5x SLOWER on a GTX 1650 (no tensor cores). true on RTX cards.
save_freq = 5000
num_workers = 2                       # dataloader workers (video decoding); raise if GPU util is low

[train.smolvla]
# robot.py train --type smolvla [--cloud]: fine-tunes SmolVLA (450M params, pretrained on community SO-100/101
# data) on the SAME recordings as ACT. It reads the task text, so one model can learn several instructions
# ("pick up the pen", "pick up the red cube") if the recordings use those task texts.
# Inference on the GTX 1650: ~1.0 s per 50-step chunk, 1.0 GiB (sim/bench_smolvla.py); rollout uses RTC.
base = "lerobot/smolvla_base"
steps = 20000                         # LeRobot's recipe; ~4 h on an A100
batch_size = 4                        # local GTX 1650 (see README "SmolVLA" for the measured speed)
cloud = "a100-large"                  # HF Jobs flavor for --cloud (paid per second; `hf jobs hardware` lists prices)
cloud_batch_size = 64
cloud_timeout = "6h"

[stage]
# stage.py: rollout -> self-check -> retry. Compare reactivity settings with `stage.py eval` and keep the winner.
duration_s = 20                       # one attempt: reach, grasp, lift, hold (rollout then returns to rest)
attempts = 3                          # retries after a self-check miss
n_action_steps = 20                   # ACT default 100 = 3.3 s blind; 20 = re-plan every 0.67 s
temporal_ensemble_coeff = 0.0         # 0.01 = re-plan every step + blend (ACT paper); overrides n_action_steps

# ---------------------------------------------------------------------------------------------
# Skills the Cloudflare router may choose from (host/robot_agent.py sends name + description).
# The LLM picks ONLY from this list - write descriptions as if explaining the skill to a person.
#   policy / duration_s     -> real arm: robot.py rollout --policy <policy>
#   replay_*                -> real arm: robot.py replay (exact recorded movement)
#   sim_policy / sim_motion -> used when the agent runs with --sim
#   instruction = true      -> the router also writes the task text ("Pick up the blue pen") and the agent
#                              passes it to the policy (robot.py rollout --task). Only SmolVLA uses it; ACT
#                              ignores text, so leave it off for ACT skills.
#
# SmolVLA skill, once a model is trained on recordings with several task texts (robot.py train --type smolvla):
# [skills.pick_object]
# description = "Picks up the object the user names (pen, cube, chess piece) and lifts it."
# policy = "smolvla_pick_objects"
# instruction = true
# duration_s = 25
[skills.pick_pen]
description = "Picks up the pen lying on the table and lifts it up."
policy = "act_pick_pen"
duration_s = 25
sim_policy = "outputs/train/act_sim_pick_pen/checkpoints/last/pretrained_model"

[skills.wave]
description = "Waves hello at the audience."
replay_dataset = "moves_wave"
replay_episode = 0
sim_motion = "wave"

[skills.reset_scene]
description = "Simulation only: puts a new pen on the table at a random spot."
sim_motion = "reset"

# MolmoAct2 (zero-shot vision-language-action model on a Lightning AI GPU, Arman's Mac). The agent runs
# <molmo dir>/do_task.py "<task>": it checks the Studio, robot and cameras, splits the task into one model
# sentence per object ("the duck and the queen into the cup" -> 2 runs), lets the model drive at 30 Hz, carries
# each held object to the taught drop pose, and brings the arm home (also on STOP). Both cameras stream to the
# Live panel. Announced only on a laptop whose config.local.toml sets [molmo] dir.
[skills.molmo_pick]
description = "Picks up the objects the user names, one after another, and drops each one into the container the user names (for example: the rubber duck and the chess queen into the cup). Its instruction must name every object and the container, e.g. 'Put the duck and the chess queen into the cup'."
molmo = true
instruction = true
duration_s = 60                       # model driving time PER OBJECT (--seconds); checks + a cold model load (~100 s) come first

[molmo]
dir = ""                              # set in config.local.toml, e.g. "~/Documents/workplace/so101-hackathon"
python = ""                           # empty = <dir>/.venv/bin/python
